services:
  eyxa:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eyxa-edr
    ports:
      - "8443:8443"
    volumes:
      # Named volume - persists the SQLite database across container restarts.
      # init_db() creates eyxa.db on first boot if it does not exist.
      - eyxa_db:/app/backend/db
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: eyxa-tunnel
    network_mode: "host"
    command: tunnel --url http://127.0.0.1:8443 --protocol http2
    restart: unless-stopped

volumes:
  eyxa_db:
    name: eyxa_db