services:
  eyxa:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eyxa-edr
    network_mode: "host"
    volumes:
      - eyxa_db:/app/backend/db
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: eyxa-tunnel
    network_mode: "host"
    command: tunnel --url http://127.0.0.1:8443 --protocol http2
    restart: unless-stopped

volumes:
  eyxa_db:
    name: eyxa_db